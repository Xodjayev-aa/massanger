# Optional container on an operator-provisioned host. No $0 durable host has
# been verified. The image compiles the pinned TDLib JSON library in-process
# (koffi); no unverified sidecar image is pulled.
#
#   make docker-up
#
# The Supabase database comes from the CLI (`supabase start`) or a hosted project.
# Set services/telegram_bridge/.env first; when Supabase runs on the Docker host,
# set SUPABASE_URL=http://host.docker.internal:54321 and MESSENGERX_ENV=development
# in that file for LOCAL TESTS ONLY (hosted workers refuse HTTP and temporary
# session paths). `localhost` inside this container is NOT the host. Keep the
# named session volume for a real worker.

name: messengerx

services:
  bridge:
    build:
      context: ..
      dockerfile: services/telegram_bridge/Dockerfile
    image: messengerx/telegram-bridge:local
    restart: unless-stopped
    env_file:
      - ../services/telegram_bridge/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BRIDGE_HEALTH_HOST: 0.0.0.0
      MESSENGERX_ENV: ${MESSENGERX_ENV:-production}
      BRIDGE_TRANSPORT: ${BRIDGE_TRANSPORT:-koffi}
    ports:
      - "127.0.0.1:8787:8787"  # admin port stays private to the host
    volumes:
      - bridge-sessions:/var/lib/messengerx-bridge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 20s
    # Losing this volume means linked users must authenticate again.
    stop_grace_period: 45s

volumes:
  bridge-sessions:
