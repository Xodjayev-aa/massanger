# TEMPORARY debug scaffold — delete once `flutter analyze` is green.
#
# Posts the analyzer output and the resolved public API of the packages this app
# depends on as a comment on the open pull request, because the Actions log host is
# unreachable from some review environments. It changes nothing about the app.
name: Analyze report (temporary)

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
      - name: pub get
        working-directory: apps/mobile_app
        run: flutter pub get | tail -3
      - name: analyze
        working-directory: apps/mobile_app
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze.txt 2>&1
          {
            echo "## \`flutter analyze\`"
            echo
            echo '```'
            grep -E "^ *(error|warning) •" /tmp/analyze.txt | head -120
            echo "--- infos (style only, not fatal)"
            grep -E "^ *info •" /tmp/analyze.txt | head -40
            tail -1 /tmp/analyze.txt
            echo '```'
          } > /tmp/report.md
      - name: test
        working-directory: apps/mobile_app
        run: |
          set +e
          flutter test --reporter expanded > /tmp/test.txt 2>&1
          echo "exit: $?"
          {
            echo
            echo "## \`flutter test\`"
            echo
            echo '```'
            grep -E "^[0-9:]+ \+[0-9]+( ~[0-9]+)?( -[0-9]+)?( \[E\])?:|Failed to load|^  [a-zA-Z_.]+:|Expected:|Actual:|Which:|^ *[0-9]+ (passed|failed)|Some tests failed|All tests passed" /tmp/test.txt | tail -70
            echo "---- raw tail ----"
            tail -25 /tmp/test.txt
            echo '```'
          } >> /tmp/report.md
      - name: post
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY:$GITHUB_HEAD_NAME&state=open" --jq '.[0].number')
          [ -n "$pr" ] || pr=1
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
