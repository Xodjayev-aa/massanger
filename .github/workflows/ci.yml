name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No Docker here on purpose: the SQL suite runs on PGlite and the bridge suite
  # runs against the in-process memory transport, so the two things most likely to
  # break (schema behaviour, sync worker logic) are checked in ~40 s on a runner
  # with no services to wait for.
  server:
    name: schema + functions + bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: migrations behave (including access and media policies)
        run: npm run test:sql
      - name: seed.sql applies and its fixtures are consistent
        run: npm run test:seed
      - name: production edge configuration fails closed
        run: npm run test:functions
      - name: bridge logic (simulator)
        run: npm run test:bridge
      - name: edge functions typecheck against Deno's lib surface
        run: npm run typecheck:functions
      - name: bridge typecheck
        run: npm run typecheck:bridge

  app:
    name: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Analyzer output lives in GitHub's Actions blob logs, which some networks
    # cannot reach. Publish it as a check-run on failure so the diagnostics are
    # retrievable through the GitHub API too (never include secrets in it).
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5   # matches the pubspec constraint; bump together with it
      # Native sources are tracked and reviewed; never regenerate project settings
      # in CI (which would hide a missing manifest/Info.plist callback).
      - name: verify native projects are tracked
        run: test -f apps/mobile_app/android/app/src/main/AndroidManifest.xml && test -f apps/mobile_app/ios/Runner/Info.plist
      - name: pub get
        working-directory: apps/mobile_app
        run: flutter pub get
      # `--no-fatal-infos` because the lint set mixes errors with stylistic hints
      # (sort_child_properties_last and friends); the Makefile keeps `fmt` as the
      # place where the house style is enforced.
      - name: analyze
        id: analyze
        working-directory: apps/mobile_app
        run: flutter analyze --no-fatal-infos 2>&1 | tee flutter-analyze.log
      - name: publish analyzer diagnostics on failure
        if: ${{ failure() && steps.analyze.outcome == 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          jq -n --arg sha "$HEAD_SHA" --rawfile log apps/mobile_app/flutter-analyze.log \
            '{name:"Flutter analyzer diagnostics",head_sha:$sha,status:"completed",conclusion:"failure",output:{title:"Flutter analysis failed",summary:"Analyzer diagnostics (first 60000 characters)",text:($log[:60000])}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input - --jq .id
      - name: unit + widget tests
        id: test
        working-directory: apps/mobile_app
        run: flutter test --reporter expanded 2>&1 | tee flutter-test.log
      - name: publish test diagnostics on failure
        if: ${{ failure() && steps.test.outcome == 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          jq -n --arg sha "$HEAD_SHA" --rawfile log apps/mobile_app/flutter-test.log \
            '{name:"Flutter test diagnostics",head_sha:$sha,status:"completed",conclusion:"failure",output:{title:"Flutter tests failed",summary:"Test diagnostics (last 60000 characters)",text:($log[-60000:])}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input - --jq .id
      - name: compile installable web site
        id: web
        working-directory: apps/mobile_app
        run: >-
          flutter build web --release
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_ANON_KEY=ci-placeholder-not-a-live-project
          2>&1 | tee flutter-web.log
      - name: publish web-build diagnostics on failure
        if: ${{ failure() && steps.web.outcome == 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          jq -n --arg sha "$HEAD_SHA" --rawfile log apps/mobile_app/flutter-web.log \
            '{name:"Flutter web diagnostics",head_sha:$sha,status:"completed",conclusion:"failure",output:{title:"Flutter web build failed",summary:"Web build diagnostics (last 60000 characters)",text:($log[-60000:])}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input - --jq .id
      - name: verify Android debug build (placeholder config; not a signed release)
        if: github.event_name != 'workflow_dispatch'
        id: android
        working-directory: apps/mobile_app
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_ANON_KEY=ci-placeholder-not-a-live-project
          2>&1 | tee flutter-android.log
      - name: publish Android build diagnostics on failure
        if: ${{ failure() && steps.android.outcome == 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          jq -n --arg sha "$HEAD_SHA" --rawfile log apps/mobile_app/flutter-android.log \
            '{name:"Android build diagnostics",head_sha:$sha,status:"completed",conclusion:"failure",output:{title:"Placeholder Android debug build failed",summary:"Diagnostics (last 60000 characters)",text:($log[-60000:])}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input - --jq .id
  # Optional public site on GitHub Pages (free repo subpath). This job is never
  # triggered by PRs or a push. The operator must provision a real hosted
  # Supabase project + worker, enable Pages from Actions and explicitly opt in
  # via repository variables before running the workflow manually.
  pages:
    name: deploy public PWA (opt-in)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          vars.LAUNCH_APPROVED == 'true' &&
          vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
    needs: [server, app]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
      - run: flutter pub get
        working-directory: apps/mobile_app
      - name: build real website under the repository base path
        working-directory: apps/mobile_app
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TELEGRAM_OIDC_ENABLED: ${{ vars.TELEGRAM_OIDC_ENABLED }}
        run: |
          flutter build web --release --base-href=/massanger/ \
            --dart-define="SUPABASE_URL=$PUBLIC_SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$PUBLIC_SUPABASE_ANON_KEY" \
            --dart-define="WEB_REDIRECT_URL=https://xodjayev-aa.github.io/massanger/" \
            --dart-define="TELEGRAM_OIDC_ENABLED=${TELEGRAM_OIDC_ENABLED:-false}"
          # Pages has no SPA rewrite; the 404 copy lets browser reloads of
          # /massanger/chats/... load the client router rather than an HTML error.
          cp build/web/index.html build/web/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile_app/build/web
      - name: deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  # Builds (never pushes) the worker image so a Dockerfile or TDLib pin that stopped
  # compiling is caught before someone deploys it.
  image:
    name: bridge image builds
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/telegram_bridge/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
